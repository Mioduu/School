<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atrybuty</title>
</head>
<body>
    <h1>Odczytanie atrybutu (adres linku) funkcją getAttribute()</h1>
    <a href="https://www.w3schools.com">Link 1</a>
    <a href="https://zsgsucha.pl">Link 2</a>

    <script>
        let lista = document.querySelectorAll('a');
        console.log(lista);
        console.log('Pierwszy: ' + lista[0].getAttribute('href'))
        console.log('Drugi: ' + lista[1].getAttribute('href'))
    </script>
</body>
</html>
