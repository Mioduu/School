<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SetAttrib</title>
</head>
<body>
    <h1>Zmiana wartości atrybutu (adres linku)</h1>
    <a href="https://www.w3schools.com">Link 1</a>


    <script>
        let a = document.querySelectorAll('a');
        a.setAttribute('href', 'https://kursjs.pl')
    </script>
</body>
</html>
